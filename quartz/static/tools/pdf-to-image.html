<!--
  Contact — PDF를 이미지로
  단일 파일 웹앱: PDF.js로 각 페이지를 캔버스에 그린 뒤
  JPG / PNG 로 저장합니다. 페이지별 개별 저장과 전체 ZIP 저장을 지원합니다.
  모든 변환은 브라우저 안에서 일어나며 파일이 서버로 전송되지 않습니다.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — PDF를 이미지로</title>

<!-- PDF.js (UMD 전역 pdfjsLib) + JSZip -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
  :root {
    --paper:      #F7F6F1;
    --panel:      #FFFFFF;
    --ink:        #16161D;
    --muted:      #6E6E78;
    --faint:      #9A9AA2;
    --line:       #E5E2D9;
    --line-soft:  #EFEDE6;
    --accent:     #2746C9;
    --accent-ink: #1E3299;
    --accent-soft:#EAEDFB;
    --danger:     #B23A3A;
    --ok:         #1F7A4D;

    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans:  ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono:  ui-monospace, "JetBrains Mono", "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 22px 72px; }

  /* ---- 헤더 ---- */
  .masthead {
    display: flex; align-items: baseline; gap: 16px;
    padding-bottom: 18px; margin-bottom: 24px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .mark {
    font-family: var(--serif);
    font-size: 30px; font-weight: 600; letter-spacing: -0.01em;
    line-height: 1;
  }
  .mark .nm { font-style: italic; }
  .mark .nm::after {
    content: ""; display: inline-block;
    width: 7px; height: 7px; margin-left: 2px; border-radius: 50%;
    background: var(--accent); vertical-align: super;
  }
  .tagline { font-size: 13px; color: var(--muted); }
  .tagline code { font-family: var(--mono); color: var(--accent-ink); }

  .col-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--faint); margin: 0 2px 9px;
  }
  .col-head .ix { font-family: var(--mono); color: var(--accent); font-size: 12px; }
  .col-head .right { margin-left: auto; text-transform: none; letter-spacing: 0; font-family: var(--mono); color: var(--muted); }
  .col-head .right b { color: var(--ink); font-weight: 600; }

  /* ---- 패널 ---- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 1px 0 rgba(22,22,29,0.02), 0 8px 24px -18px rgba(22,22,29,0.25);
  }

  /* ---- 드롭존 ---- */
  .dropzone {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 10px;
    padding: 44px 22px;
    border: 1.5px dashed var(--line);
    border-radius: 12px;
    background: var(--panel);
    cursor: pointer;
    transition: border-color .14s ease, background .14s ease;
  }
  .dropzone:hover { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone.drag { border-color: var(--accent); background: var(--accent-soft); }
  .dropzone .ico { width: 40px; height: 40px; color: var(--accent); }
  .dropzone .big { font-size: 15px; color: var(--ink); }
  .dropzone .big b { color: var(--accent-ink); }
  .dropzone .sub { font-size: 12.5px; color: var(--muted); }

  /* ---- 컨트롤 ---- */
  .controls { margin-top: 20px; padding: 6px 16px; }
  .ctrl-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 2px; flex-wrap: wrap;
  }
  .ctrl-row + .ctrl-row { border-top: 1px solid var(--line-soft); }
  .ctrl-label { font-size: 12px; color: var(--muted); width: 76px; flex: none; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button {
    font-family: var(--sans); font-size: 12.5px; color: var(--ink);
    padding: 6px 14px; border: 0; background: transparent; cursor: pointer;
    border-right: 1px solid var(--line); transition: background .12s;
  }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { background: var(--accent-soft); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }

  input[type="range"] { accent-color: var(--accent); }
  .res-val { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 150px; }
  .res-val b { color: var(--ink); font-weight: 600; }
  .hint { font-size: 11.5px; color: var(--faint); }

  /* ---- 액션 바 ---- */
  .actionbar { display: flex; align-items: center; gap: 10px; margin: 22px 0 14px; flex-wrap: wrap; }
  .btn {
    font-family: var(--sans); font-size: 14px; font-weight: 500;
    padding: 11px 16px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    transition: all .12s ease; display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: var(--accent-ink); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn svg { width: 16px; height: 16px; }
  .btn.mini { padding: 6px 11px; font-size: 12.5px; border-radius: 7px; }
  .btn.mini svg { width: 13px; height: 13px; }

  .status { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: auto; }
  .status.err { color: var(--danger); }
  .status.ok { color: var(--ok); }

  /* 진행 바 */
  .progress { height: 4px; background: var(--line-soft); border-radius: 3px; overflow: hidden; margin: 0 0 16px; display: none; }
  .progress.show { display: block; }
  .progress .bar { height: 100%; width: 0%; background: var(--accent); transition: width .18s ease; }

  /* ---- 페이지 그리드 ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 18px;
  }
  .page-card {
    margin: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .thumb {
    background:
      linear-gradient(45deg, #f0efe9 25%, transparent 25%),
      linear-gradient(-45deg, #f0efe9 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #f0efe9 75%),
      linear-gradient(-45deg, transparent 75%, #f0efe9 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    display: flex; align-items: center; justify-content: center;
    padding: 12px; min-height: 150px;
  }
  .thumb canvas {
    max-width: 100%; height: auto; display: block;
    box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 6px 18px -12px rgba(0,0,0,.4);
    background: #fff;
  }
  .thumb .spin { color: var(--faint); font-family: var(--mono); font-size: 12px; }
  figcaption {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 11px; border-top: 1px solid var(--line-soft);
    font-family: var(--mono); font-size: 11.5px; color: var(--muted);
  }
  figcaption .pno { color: var(--ink); font-weight: 600; }
  figcaption .psize { color: var(--faint); }
  figcaption .btn.mini { margin-left: auto; }

  /* ---- 개인정보 안내 ---- */
  .note {
    margin-top: 20px; font-size: 12.5px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .note svg { width: 15px; height: 15px; color: var(--ok); flex: none; }

  /* ---- 토스트 ---- */
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(14px);
    background: var(--ink); color: #fff; font-size: 13.5px;
    padding: 10px 16px; border-radius: 9px; opacity: 0; pointer-events: none;
    transition: all .22s ease; box-shadow: 0 10px 30px -12px rgba(0,0,0,.5); z-index: 50;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.danger { background: var(--danger); }

  [hidden] { display: none !important; }
</style>

<div class="wrap">
  <header class="masthead">
    <div class="mark"><span class="nm">Contact</span></div>
    <div class="tagline"><code>PDF</code> 를 페이지별 이미지(<code>JPG</code>·<code>PNG</code>)로 변환해 저장합니다</div>
  </header>

  <!-- 01 입력 -->
  <section>
    <div class="col-head"><span class="ix">01</span> PDF 넣기</div>
    <div class="dropzone panel" id="drop" role="button" tabindex="0" aria-label="PDF 파일 선택">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="18" x2="12" y2="12"/>
        <polyline points="9 15 12 12 15 15"/>
      </svg>
      <div class="big"><b>PDF를 여기에 끌어다 놓거나</b> 클릭해 선택</div>
      <div class="sub">파일은 브라우저 안에서만 처리되며 어디에도 업로드되지 않습니다</div>
      <input type="file" id="file" accept="application/pdf,.pdf" hidden>
    </div>
  </section>

  <!-- 컨트롤 -->
  <div class="controls panel">
    <div class="ctrl-row">
      <span class="ctrl-label">형식</span>
      <div class="seg" id="fmtSeg">
        <button data-fmt="jpg" aria-pressed="true">JPG</button>
        <button data-fmt="png" aria-pressed="false">PNG</button>
      </div>
      <span class="hint" id="fmtHint">JPG는 용량이 작아 사진·문서에, PNG는 텍스트·도표가 더 또렷합니다</span>
    </div>
    <div class="ctrl-row">
      <span class="ctrl-label">해상도</span>
      <input type="range" id="dpi" min="72" max="400" step="1" value="150" style="flex:1; max-width:320px;">
      <span class="res-val" id="dpiVal">—</span>
    </div>
  </div>

  <!-- 02 결과 -->
  <section id="result" hidden style="margin-top:26px;">
    <div class="col-head">
      <span class="ix">02</span> 페이지 · 미리보기
      <span class="right"><b id="fname">—</b> · <span id="pcount">—</span></span>
    </div>

    <div class="actionbar">
      <button class="btn primary" id="zipBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        전체 ZIP 다운로드
      </button>
      <button class="btn" id="resetBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v6h6"/><path d="M3 8a9 9 0 1 0 3-5.7L3 8"/></svg>
        새 PDF
      </button>
      <span class="status" id="status"></span>
    </div>

    <div class="progress" id="progress"><div class="bar" id="bar"></div></div>

    <div class="grid" id="grid"></div>
  </section>

  <div class="note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
    모든 변환은 이 페이지 안에서 처리됩니다. PDF 파일은 서버로 전송되지 않습니다.
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  const $ = (s) => document.querySelector(s);

  // ---- PDF.js 워커 ----
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }

  // ---- 상태 ----
  const state = {
    format: "jpg",        // jpg | png
    dpi: 150,
    jpgQuality: 0.92,
  };

  let pdfDoc = null;
  let pageCount = 0;
  let baseName = "pdf";      // 다운로드 파일 기본 이름 (확장자 제외)
  let pageBase = [];         // pageBase[n] = { w, h }  (scale 1 기준, 1-index)
  let busy = false;          // ZIP 등 일괄 작업 진행 여부

  const dropEl   = $("#drop");
  const fileEl   = $("#file");
  const resultEl = $("#result");
  const gridEl   = $("#grid");
  const zipBtn   = $("#zipBtn");
  const resetBtn = $("#resetBtn");
  const statusEl = $("#status");
  const progress = $("#progress");
  const barEl    = $("#bar");
  const dpiEl    = $("#dpi");
  const dpiVal   = $("#dpiVal");
  const fmtSeg   = $("#fmtSeg");
  const fnameEl  = $("#fname");
  const pcountEl = $("#pcount");
  const toastEl  = $("#toast");

  // ---- 유틸 ----
  function dpiToScale(dpi) { return dpi / 72; }
  function ext() { return state.format === "png" ? "png" : "jpg"; }
  function mime() { return state.format === "png" ? "image/png" : "image/jpeg"; }
  function pad(n, width) { return String(n).padStart(width, "0"); }
  function padW() { return String(pageCount).length; }

  let toastTimer;
  function toast(msg, danger) {
    toastEl.textContent = msg;
    toastEl.classList.toggle("danger", !!danger);
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2400);
  }

  function setStatus(msg, kind) {
    statusEl.textContent = msg || "";
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  function setProgress(frac) {
    if (frac == null) { progress.classList.remove("show"); barEl.style.width = "0%"; return; }
    progress.classList.add("show");
    barEl.style.width = Math.max(0, Math.min(100, frac * 100)).toFixed(1) + "%";
  }

  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  // ---- 해상도 표시 ----
  function updateDpiLabel() {
    const scale = dpiToScale(state.dpi);
    dpiVal.innerHTML = "<b>" + state.dpi + " DPI</b> · 배율 " + scale.toFixed(2) + "×";
    // 각 페이지 카드의 출력 크기 라벨 갱신
    for (let n = 1; n <= pageCount; n++) {
      const el = document.getElementById("psize-" + n);
      const b = pageBase[n];
      if (el && b) {
        const w = Math.ceil(b.w * scale);
        const h = Math.ceil(b.h * scale);
        el.textContent = w + "×" + h + " · " + state.dpi + "dpi";
      }
    }
  }

  // ---- 렌더링 ----
  // 지정 배율로 한 페이지를 캔버스에 그린다. JPG/PNG 모두 흰 배경을 먼저 채운다
  // (PDF 페이지는 배경이 투명할 수 있어, JPG에서는 검게, PNG에서는 뚫려 보일 수 있음).
  async function renderPage(pageNum, scale) {
    const page = await pdfDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.ceil(viewport.width));
    canvas.height = Math.max(1, Math.ceil(viewport.height));
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    return canvas;
  }

  function canvasToBlob(canvas) {
    return new Promise((res, rej) => {
      canvas.toBlob(
        (b) => (b ? res(b) : rej(new Error("이미지 생성 실패"))),
        mime(),
        state.format === "png" ? undefined : state.jpgQuality
      );
    });
  }

  // ---- PDF 로드 ----
  async function handleFile(file) {
    if (busy) { toast("작업이 끝난 뒤 다시 시도해 주세요", true); return; }
    if (!file) return;
    const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
    if (!isPdf) { toast("PDF 파일만 넣을 수 있습니다", true); return; }

    resetState();
    baseName = (file.name || "pdf").replace(/\.pdf$/i, "").trim() || "pdf";
    setStatus("불러오는 중…");

    let buf;
    try {
      buf = await file.arrayBuffer();
    } catch (e) {
      setStatus("파일을 읽지 못했습니다", "err");
      toast("파일을 읽지 못했습니다", true);
      return;
    }

    try {
      pdfDoc = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    } catch (e) {
      const msg = /password/i.test(String(e && e.message))
        ? "암호로 보호된 PDF는 열 수 없습니다"
        : "PDF를 여는 데 실패했습니다";
      setStatus(msg, "err");
      toast(msg, true);
      return;
    }

    pageCount = pdfDoc.numPages;
    pageBase = new Array(pageCount + 1);

    resultEl.hidden = false;
    fnameEl.textContent = baseName + ".pdf";
    pcountEl.textContent = pageCount + "쪽";

    buildGrid();
    updateDpiLabel();

    // 미리보기 썸네일을 순차 렌더 (메모리 급증 방지)
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    setStatus("미리보기 준비 중…");
    for (let n = 1; n <= pageCount; n++) {
      try {
        const page = await pdfDoc.getPage(n);
        const vp1 = page.getViewport({ scale: 1 });
        pageBase[n] = { w: vp1.width, h: vp1.height };
        // 썸네일: 화면 표시 폭 ~ 420px 기준, 레티나 보정
        const targetW = 420 * dpr;
        const thumbScale = Math.min(2.5, Math.max(0.3, targetW / vp1.width));
        const canvas = await renderPage(n, thumbScale);
        const slot = document.getElementById("thumb-" + n);
        if (slot) { slot.innerHTML = ""; canvas.style.maxWidth = "100%"; slot.appendChild(canvas); }
      } catch (e) {
        const slot = document.getElementById("thumb-" + n);
        if (slot) slot.innerHTML = '<span class="spin">렌더 실패</span>';
      }
      updateDpiLabel();
    }
    zipBtn.disabled = false;
    setStatus(pageCount + "쪽 준비 완료", "ok");
  }

  // ---- 그리드 구성 ----
  function buildGrid() {
    gridEl.innerHTML = "";
    const w = padW();
    for (let n = 1; n <= pageCount; n++) {
      const fig = document.createElement("figure");
      fig.className = "page-card";
      fig.innerHTML =
        '<div class="thumb" id="thumb-' + n + '"><span class="spin">렌더 중…</span></div>' +
        '<figcaption>' +
          '<span class="pno">p.' + pad(n, w) + '</span>' +
          '<span class="psize" id="psize-' + n + '">—</span>' +
          '<button class="btn mini" data-page="' + n + '">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
            '저장' +
          '</button>' +
        '</figcaption>';
      gridEl.appendChild(fig);
    }
  }

  // ---- 개별 저장 ----
  async function savePage(n) {
    if (busy) { toast("작업이 끝난 뒤 다시 시도해 주세요", true); return; }
    busy = true;
    setStatus("p." + pad(n, padW()) + " 변환 중…");
    try {
      const canvas = await renderPage(n, dpiToScale(state.dpi));
      const blob = await canvasToBlob(canvas);
      downloadBlob(blob, baseName + "-p" + pad(n, padW()) + "." + ext());
      setStatus("p." + pad(n, padW()) + " 저장 완료", "ok");
    } catch (e) {
      setStatus("변환 실패: " + (e && e.message ? e.message : e), "err");
      toast("변환에 실패했습니다", true);
    } finally {
      busy = false;
    }
  }

  // ---- 전체 ZIP ----
  async function saveZip() {
    if (busy || !pdfDoc) return;
    if (!window.JSZip) { toast("압축 라이브러리를 불러오지 못했습니다", true); return; }
    busy = true;
    zipBtn.disabled = true;
    const w = padW();
    const zip = new JSZip();
    const scale = dpiToScale(state.dpi);
    try {
      for (let n = 1; n <= pageCount; n++) {
        setStatus("변환 중 " + n + " / " + pageCount);
        setProgress((n - 1) / pageCount);
        const canvas = await renderPage(n, scale);
        const blob = await canvasToBlob(canvas);
        zip.file(baseName + "-p" + pad(n, w) + "." + ext(), blob);
      }
      setStatus("압축하는 중…");
      const out = await zip.generateAsync({ type: "blob" }, (meta) => {
        setProgress(0.9 + (meta.percent / 100) * 0.1);
      });
      setProgress(1);
      downloadBlob(out, baseName + "-images.zip");
      setStatus(pageCount + "쪽 ZIP 저장 완료", "ok");
    } catch (e) {
      setStatus("ZIP 생성 실패: " + (e && e.message ? e.message : e), "err");
      toast("ZIP 생성에 실패했습니다", true);
    } finally {
      setTimeout(() => setProgress(null), 600);
      busy = false;
      zipBtn.disabled = false;
    }
  }

  // ---- 상태 초기화 ----
  function resetState() {
    pdfDoc = null; pageCount = 0; pageBase = [];
    gridEl.innerHTML = "";
    resultEl.hidden = true;
    zipBtn.disabled = true;
    setStatus("");
    setProgress(null);
  }

  // ---- 이벤트: 드롭존 ----
  dropEl.addEventListener("click", () => { if (!busy) fileEl.click(); });
  dropEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileEl.click(); }
  });
  fileEl.addEventListener("change", () => {
    if (fileEl.files && fileEl.files[0]) handleFile(fileEl.files[0]);
    fileEl.value = "";  // 같은 파일 다시 선택 가능하도록
  });
  ["dragenter", "dragover"].forEach((ev) =>
    dropEl.addEventListener(ev, (e) => { e.preventDefault(); dropEl.classList.add("drag"); })
  );
  ["dragleave", "drop"].forEach((ev) =>
    dropEl.addEventListener(ev, (e) => { e.preventDefault(); dropEl.classList.remove("drag"); })
  );
  dropEl.addEventListener("drop", (e) => {
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });
  // 창 전체에서 실수로 파일을 놓쳐 페이지가 열리는 것 방지
  ["dragover", "drop"].forEach((ev) =>
    window.addEventListener(ev, (e) => { if (e.target !== fileEl) e.preventDefault(); })
  );

  // ---- 이벤트: 컨트롤 ----
  fmtSeg.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    [...fmtSeg.children].forEach((b) => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
    state.format = btn.dataset.fmt;
  });

  dpiEl.addEventListener("input", () => {
    state.dpi = Number(dpiEl.value);
    updateDpiLabel();
  });

  gridEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-page]");
    if (btn) savePage(Number(btn.dataset.page));
  });

  zipBtn.addEventListener("click", saveZip);
  resetBtn.addEventListener("click", () => { if (!busy) resetState(); });

  // ---- 시작 ----
  updateDpiLabel();
  if (!window.pdfjsLib) {
    setStatus("PDF 라이브러리를 불러오지 못했습니다 (네트워크 확인)", "err");
  }
})();
</script>
